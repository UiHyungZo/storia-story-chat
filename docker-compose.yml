services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: storia
      MARIADB_USER: storia
      MARIADB_PASSWORD: storia
      MARIADB_ROOT_PASSWORD: storia
    ports:
      # 3307 → local Homebrew mysqld already occupies 127.0.0.1:3306 on this machine
      - "3307:3306"
    volumes:
      - storia_db_data:/var/lib/mysql

volumes:
  storia_db_data:
