name: Release

# Cut a release by pushing a tag:  git tag v1.0.0 && git push origin v1.0.0
# or run manually from the Actions tab (pick a platform).
#
# iOS   -> signed IPA -> TestFlight
# Android -> signed AAB -> Google Play "internal" track (draft)
#
# All credentials are repo secrets. See docs/deployment.md for the full list
# and the one-time setup (App Store Connect app record, com.storia.client
# provisioning profile, Android upload keystore, Play service account). iOS
# signing reuses the Aran project's distribution .p12 + ASC API key.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to build
        type: choice
        options: [both, ios, android]
        default: both

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/client

jobs:
  ios:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["both","ios"]'), inputs.platform)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
      ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      BUILD_NUMBER: ${{ github.run_number }}
      # Runner auto-installs Bundler 4.x, which chokes on lockfile CHECKSUMS in
      # frozen mode. Pin a stable 2.5.x (matches the Aran project).
      BUNDLER_VERSION: "2.5.23"
      # No Sentry auth token / CI wiring for source map upload yet, so
      # @sentry/react-native's Xcode build phase would otherwise try to
      # upload source maps and fail the whole archive with "An organization
      # ID or slug is required" (same reason local `expo run:ios` needs this
      # — see docs/deployment.md). Crash reporting itself works fine without
      # uploaded source maps (App.tsx reads EXPO_PUBLIC_SENTRY_DSN below) —
      # just with minified stack traces until upload is set up.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      # RN 0.86 needs Xcode >= 16.1, and expo-modules-jsi's local SPM package
      # declares `swift-tools-version: 6.2`, which only Xcode 26+ toolchains
      # support (Xcode 16.x's Swift 6.1 fails package resolution outright).
      # Xcode 26.0.1/26.1.1 then reject `weak let` in that package (Swift 6.2
      # doesn't have it yet), and 26.2/26.3 reject RuntimeScheduler.h's
      # SWIFT_RETURNS_RETAINED/SWIFT_SHARED_REFERENCE pairing as "not
      # returning a SWIFT_SHARED_REFERENCE type" even though the class is
      # correctly annotated — a toolchain bug fixed by 26.4. So we can't just
      # pick "latest installed": we need >=26.4 specifically. `macos-15` never
      # got past 26.3, so this job runs on `macos-26`, whose image ships
      # 26.4.1/26.5/26.6 — pin to the 26.4.x we've verified with a local
      # clean build rather than trusting its "latest" (26.6, untested here).
      - name: Select Xcode 26.4
        run: |
          MATCH=""
          for app in /Applications/Xcode*.app; do
            ver=$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo "")
            if [[ "$ver" == 26.4* ]]; then
              MATCH="$app"
              break
            fi
          done
          if [[ -z "$MATCH" ]]; then
            echo "::error::No Xcode 26.4.x found on this runner image (expo-modules-jsi needs it — see comment above)"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Using $MATCH"
          sudo xcode-select -s "$MATCH/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - run: npm ci

      # app.json references ./GoogleService-Info.plist, which is gitignored.
      - name: Restore GoogleService-Info.plist
        run: echo "${{ secrets.IOS_GOOGLE_SERVICES_PLIST_B64 }}" | base64 --decode > GoogleService-Info.plist

      # Generate ios/ native project.
      - name: expo prebuild (ios)
        run: npx expo prebuild --platform ios --no-install

      # prebuild --no-install skips pods; do it explicitly so Storia.xcworkspace
      # exists and any CocoaPods failure is visible instead of swallowed.
      - name: pod install
        run: npx pod-install

      - name: Verify workspace
        run: test -d ios/Storia.xcworkspace || (echo "::error::Storia.xcworkspace missing after pod install" && ls -la ios && exit 1)

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install gems
        run: |
          gem install bundler -v "$BUNDLER_VERSION"
          bundle install --jobs 3

      # Distribution .p12 + App Store provisioning profile into a temp keychain.
      # Mirrors the Aran project's approach — no fastlane match, no cert repo.
      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_certificate.p12"
          PP_PATH="$RUNNER_TEMP/storia_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_SPECIFIER=$NAME" >> "$GITHUB_ENV"

      - name: fastlane ios beta
        run: bundle exec fastlane ios beta

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      # gym's live-formatted output truncates multi-line xcodebuild errors
      # (e.g. "Could not resolve package dependencies:" with no reason shown).
      # The full reason is only in this raw log.
      - name: Upload gym log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storia-ios-gym-log
          path: /Users/runner/Library/Logs/gym/*.log
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storia-ios-ipa
          path: apps/client/build/ios/*.ipa
          if-no-files-found: warn
          retention-days: 14

  android:
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["both","android"]'), inputs.platform)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STORIA_UPLOAD_STORE_FILE: ${{ github.workspace }}/apps/client/storia-upload.keystore
      STORIA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      STORIA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      STORIA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_JSON_KEY_FILE: ${{ github.workspace }}/apps/client/fastlane/play-service-account.json
      BUILD_NUMBER: ${{ github.run_number }}
      BUNDLER_VERSION: "2.5.23"
      # Same reason as the iOS job: no Sentry auth token / CI wiring for
      # source map upload yet, so the RN Sentry Gradle plugin's bundle task
      # would otherwise fail with "An organization ID or slug is required".
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install gems
        run: |
          gem install bundler -v "$BUNDLER_VERSION"
          bundle install --jobs 3

      - name: Restore google-services.json
        run: echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > google-services.json

      - name: Restore upload keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > storia-upload.keystore

      - name: Restore Play service account
        run: |
          mkdir -p fastlane
          echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}" | base64 --decode > fastlane/play-service-account.json

      - name: expo prebuild (android)
        run: npx expo prebuild --platform android

      - name: fastlane android beta
        run: bundle exec fastlane android beta

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storia-android-aab
          path: apps/client/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
