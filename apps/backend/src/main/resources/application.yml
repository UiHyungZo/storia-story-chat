spring:
  application:
    name: backend
  datasource:
    url: jdbc:mariadb://localhost:3307/storia?allowPublicKeyRetrieval=true&useSSL=false
    username: storia
    password: storia
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3.6-flash
  base-url: https://generativelanguage.googleapis.com

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

tts:
  api-key: ${TTS_API_KEY:}
  base-url: https://texttospeech.googleapis.com
  language-code: ko-KR
  voice-name: ko-KR-Standard-A

stt:
  api-key: ${STT_API_KEY:}
  base-url: https://speech.googleapis.com
  language-code: ko-KR
  sample-rate-hertz: 48000
  # LiveKit Track Egress streams the track as interleaved stereo pcm_s16le; without
  # this Google STT reads the interleaved samples as mono and returns no results.
  audio-channel-count: 2

livekit:
  host: ${LIVEKIT_HOST:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
  # 로컬 개발 시엔 LiveKit Cloud가 이 백엔드로 다시 접속해야 하므로 공인 접근 가능한
  # 주소가 필요함(예: ngrok 등 터널) — HANDOFF.md 참고.
  egress-audio-ws-url: ${LIVEKIT_EGRESS_AUDIO_WS_URL:}

admin:
  # 운영 콘솔(apps/admin) 로그인 비밀번호. 비어있으면 AdminAuthController가 모든 로그인을 거부한다.
  password: ${ADMIN_PASSWORD:}

storia:
  rag:
    # 허용 목록 문서(KnowledgeSources)를 찾을 저장소 루트. apps/backend에서 실행하면 ../.. 가 저장소 루트다.
    docs-root: ${STORIA_RAG_DOCS_ROOT:../..}
    # local(기본): 외부 호출 없는 로컬 n-gram 해싱 벡터(의미 임베딩 아님) / gemini: Gemini Embedding API(외부 유료 호출)
    provider: ${STORIA_RAG_PROVIDER:local}
    cache-dir: ${STORIA_RAG_CACHE_DIR:.storia-rag-cache}
    gemini-model: ${STORIA_RAG_GEMINI_MODEL:gemini-embedding-2}
    dimensions: 768

sentry:
  # 비어있으면 SDK가 스스로 비활성화됨(이벤트 전송 안 함, 예외도 안 던짐) — 다른 외부
  # 연동과 동일한 graceful-degradation, 별도 isConfigured() 가드 불필요.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: 1.0
