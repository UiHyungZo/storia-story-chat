spring:
  application:
    name: backend
  datasource:
    url: jdbc:mariadb://localhost:3307/storia?allowPublicKeyRetrieval=true&useSSL=false
    username: storia
    password: storia
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.0-flash
  base-url: https://generativelanguage.googleapis.com
