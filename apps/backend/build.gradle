plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.storia'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	// WebClient only (not the full reactive-web starter) so the app stays on the
	// Servlet stack — needed to call Gemini's streaming API from an MVC app.
	implementation 'org.springframework:spring-webflux'
	implementation 'io.projectreactor.netty:reactor-netty-http'
	implementation 'com.google.firebase:firebase-admin:9.4.3'
	implementation 'io.livekit:livekit-server:0.15.0'
	implementation 'io.sentry:sentry-spring-boot-4:8.50.1'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.3'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	// live 평가(@Tag("live"))는 외부 Gemini API를 호출하므로 기본 테스트에서 제외한다.
	useJUnitPlatform {
		excludeTags 'live'
	}
}

// 실제 Gemini를 호출하는 평가. 비용 발생: RUN_LIVE_EVAL=true GEMINI_API_KEY=... ./gradlew evalLive
tasks.register('evalLive', Test) {
	group = 'verification'
	description = 'Runs live (paid) LLM evaluation; requires RUN_LIVE_EVAL=true and GEMINI_API_KEY.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'live'
	}
	outputs.upToDateWhen { false }
	testLogging.showStandardStreams = true
}
